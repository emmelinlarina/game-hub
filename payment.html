<!DOCTYPE html>
<html lang="en">

<head>
    <title>Payment</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This page is for making a payment">
    <script src="https://kit.fontawesome.com/e0e8f3b90b.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/payment.css">

</head>

<body>
    <header>
        <a href="index.html">
            <img src="images/logo/gamehublogo.png" class="logo" alt="GameHub logo"></a>
        <nav aria-label="Primary">
            <ul class="menu">
                <li><a href="products.html">BUY GAMES</a></li>
                <li><a href="products.html">SELL GAMES</a></li>
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-user"></i>
                <li><a href="checkout.html" aria-label="View Cart">
                        <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i></a>
                    <span class="cart-quantity js-cart-quantity" aria-live="polite">0</span>
                </li>
            </ul>
        </nav>
    </header>

    <div id="page-loader" role="status" aria-live="polite">
        <div class="spinner"></div>
    </div>

    <main>
        <div class="container">
            <div class="checkoutlayout">
                <div class="returncart">
                    <a href="products.html">Keep shopping</a>
                    <hr>
                    <h1>PAYMENT</h1>
                </div>

                <div class="list" aria-live="polite">
                    <div class="info">
                        <div class="name"></div>
                        <div class="price"></div>
                        <div class="playbox"></div>
                    </div>
                    <div class="returnprice"></div>
                </div>

                <div class="right">
                    <h1>Please select a payment method:</h1>
                    <div>
                        <li aria-hidden="true"><i class="fa-brands fa-paypal"></i></li>
                        <li aria-hidden="true"><i class="fa-brands fa-cc-visa"></i></li>
                        <li aria-hidden="true"><i class="fa-brands fa-google-pay"></i></li>
                        <li aria-hidden="true"><i class="fa-brands fa-cc-mastercard"></i></li>
                    </div>

                    <form class="form" novalidate>
                        <div class="group">
                            <label for="Card number">Card number</label>
                            <input type="text" name="card-number" id="card-number" inputmode="numeric"
                                autocomplete="cc-number" placeholder="1234 4567 4321 7654">
                        </div>
                        <div class="group">
                            <label for="exp-date">Expiration date</label>
                            <input type="text" name="exp-date" id="exp-date" inputmode="numeric" autocomplete="cc-exp"
                                placeholder="MM/YY">
                        </div>
                        <div class="group">
                            <label for="cvv">CVV</label>
                            <input id="cvv" name="cvv" inputmode="numeric" autocomplete="cc-csc" placeholder="123">
                        </div>
                        <div class="group">
                            <label for="cardholder">Cardholder name</label>
                            <input id="cardholder" name="cardholder" autocomplete="cc-name" placeholder="Full name">
                        </div>
                        <div class="group">
                            <label for="email">Email</label>
                            <input id="email" name="email" type="email" autocomplete="email"
                                placeholder="you@example.com">
                            <p>We will send the receipt to your email</p>
                        </div>
                    </form>

                    <div class="return" aria-live="polite">
                        <div class="row"></div>
                    </div>

                    <button class="buttoncheckout">
                        <a href="checkout-success.html" role="button">CHECKOUT</a>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="row">
            <div class="col">
                <img src="images/logo/gamehublogo.png" alt="Gamehub logo">
            </div>
            <div class="col">
                <p>EASY AND SECURE PAYMENTS</p>
                <div class="social-icons" aria-label="Payment options">
                    <i class="fa-brands fa-paypal" aria-hidden="true"></i>
                    <i class="fa-brands fa-cc-visa" aria-hidden="true"></i>
                    <i class="fa-brands fa-google-pay" aria-hidden="true"></i>
                    <i class="fa-brands fa-cc-mastercard" aria-hidden="true"></i>
                </div>
            </div>
        </div>
    </footer>



    <script type="module" src="script/payment.js"></script>

</body>

</html>
